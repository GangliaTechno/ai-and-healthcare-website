<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | AI in Healthcare</title>
    <link href="/assets/images/fav-transparent.png" rel="icon" type="image/ico" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #D14905;
            --bg-light: #f5f5f5;
            --text-dark: #222;
            --white: #ffffff;
            --shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-light);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: var(--white);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .logo-wrapper {
            margin-bottom: 30px;
        }

        .logo-wrapper img {
            max-width: 250px;
            height: auto;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 35px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(209, 73, 5, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s, box-shadow 0.3s;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(209, 73, 5, 0.2);
        }

        button:hover {
            background-color: #b53d04;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(209, 73, 5, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        #message {
            margin-top: 25px;
            font-size: 14px;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .error-message {
            background-color: #fff5f5;
            color: #e53e3e;
            display: block !important;
        }

        .success-message {
            background-color: #f0fff4;
            color: #38a169;
            display: block !important;
        }

        .footer-text {
            margin-top: 40px;
            font-size: 13px;
            color: #888;
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-wrapper">
            <img alt="MAHE" src="/assets/images/logo.webp" />
        </div>
        <h2>Admin Authentication</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="email@mahe.edu" required />
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required />
                </div>
            </div>

            <button type="submit" id="loginBtn">Secure Login</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const messageEl = document.getElementById("message");
        const loginBtn = document.getElementById("loginBtn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            
            // UI Feedback
            loginBtn.innerText = "Authenticating...";
            loginBtn.disabled = true;
            messageEl.className = "";
            messageEl.style.display = "none";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("/api/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.status === 200) {
                    messageEl.innerText = "Login Successful! Redirecting...";
                    messageEl.className = "success-message";
                    
                    localStorage.setItem("isAdmin", "true");
                    localStorage.setItem("adminEmail", email);
                    localStorage.setItem("adminToken", data.token);
                    
                    setTimeout(() => {
                        window.location.href = "/admin-dashboard.html";
                    }, 1000);
                } else {
                    messageEl.innerText = data.message || "Invalid credentials.";
                    messageEl.className = "error-message";
                    loginBtn.innerText = "Secure Login";
                    loginBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                messageEl.innerText = "Server error. Please try again later.";
                messageEl.className = "error-message";
                loginBtn.innerText = "Secure Login";
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
