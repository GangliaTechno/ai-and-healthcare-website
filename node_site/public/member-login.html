<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Login – Dept of AI in Healthcare</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
    rel="stylesheet" />
  <link href="/assets/images/fav-transparent.png" rel="icon" type="image/ico" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      overflow: hidden;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.45)), url('/assets/images/contact.png') no-repeat center center fixed;
      background-size: cover;
      filter: blur(5px);
      /* Subtle blur */
      transform: scale(1.05);
      /* Prevents white edges */
      z-index: -1;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 100%;
      max-width: 340px;
      border-radius: 24px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      animation: formSlideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }

    @keyframes formSlideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header-branding {
      padding: 20px 25px 10px;
      text-align: center;
      border-bottom: 1px solid rgba(241, 245, 249, 0.5);
    }

    .header-branding img {
      height: 38px;
      margin-bottom: 10px;
    }

    .header-branding h2 {
      font-size: 22px;
      font-weight: 800;
      color: #1e293b;
      letter-spacing: -0.5px;
    }

    .header-branding p {
      font-size: 13px;
      color: #64748b;
      margin-top: 5px;
    }

    .login-body {
      padding: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1e293b;
      background: #f8fafc;
      transition: all 0.2s;
      outline: none;
    }

    input:focus {
      border-color: #e85626;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(232, 86, 38, 0.1);
    }

    /* Override browser autofill blue highlight with light orange */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 30px #fff7ed inset !important;
      -webkit-text-fill-color: #1e293b !important;
      box-shadow: 0 0 0 30px #fff7ed inset !important;
      border-color: #e85626 !important;
    }

    .btn-signin {
      width: 100%;
      padding: 14px;
      background: #e85626;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(232, 86, 38, 0.2);
    }

    .btn-signin:hover {
      background: #d14a1f;
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(232, 86, 38, 0.3);
    }

    .error-msg {
      color: #dc2626;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 15px;
      min-height: 18px;
    }

    .footer-links {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #64748b;
    }

    .footer-links a {
      color: #e85626;
      text-decoration: none;
      font-weight: 700;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .back-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .back-nav:hover {
      color: #e85626;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <div class="header-branding">
      <img src="/assets/images/logo.webp" alt="MAHE Logo" />
      <div
        style="font-family: 'EB Garamond', serif; font-weight: 700; color: #222; font-size: 22px; line-height: 1.1; margin-top: 10px;">
        Dept. of AI in Healthcare</div>
      <div
        style="font-family: 'EB Garamond', serif; font-weight: 500; color: #555; font-size: 14px; line-height: 1.1; margin-bottom: 15px; margin-top: 4px;">
        Kasturba Medical College, Manipal</div>
      <h2 style="color: #e85626; margin-top: 10px;">Member Login</h2>
      <!--<p>Dept. of AI in Healthcare</p>-->
    </div>

    <div class="login-body">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input id="loginEmail" type="email" placeholder="name@institution.edu" required />
        </div>
        <br>
        <div class="form-group">
          <label>Password</label>
          <input id="loginPassword" type="password" placeholder="••••••••" required />
        </div>
        <p class="error-msg" id="loginError"></p>
        <button type="submit" class="btn-signin" id="loginBtn">Sign In</button>
      </form>

      <div class="footer-links">
        Don't have an account? <a href="member-register.html">Request Access</a>
      </div>

      <a href="for-educators.html" class="back-nav">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back to For Educators
      </a>
    </div>

    <script>
      async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errEl = document.getElementById('loginError');
        const btn = document.getElementById('loginBtn');

        errEl.textContent = '';
        btn.disabled = true;
        btn.textContent = 'Verifying...';

        try {
          const res = await fetch('/api/member/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const data = await res.json();

          if (!res.ok) {
            errEl.textContent = data.message || 'Login failed.';
            return;
          }

          localStorage.setItem('memberToken', data.token);
          localStorage.setItem('memberEmail', data.member.email);
          localStorage.setItem('memberName', data.member.name);
          window.location.href = 'for-educators.html';

        } catch (err) {
          errEl.textContent = 'Connection error. Please try again.';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      }
    </script>
</body>

</html>
